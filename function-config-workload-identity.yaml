tenant: "public"
namespace: "default"
name: "pubsub-publisher-workload-identity"
className: "com.example.pulsar.function.PubSubPublisherWorkloadIdentityFunction"

inputs:
  - "persistent://public/default/input-topic"

autoAck: true
parallelism: 1

userConfig:
  # GCP Configuration
  gcp.project.id: "streaming-sales"
  gcp.pubsub.topic: "pulsar-test"
  gcp.pubsub.endpoint: "pubsub.googleapis.com:443"

  # Workload Identity Federation Configuration
  # Pool ID format: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_NAME
  # Example: projects/123456789/locations/global/workloadIdentityPools/my-pool
  gcp.workload.identity.pool.id: "projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_POOL_NAME"
  
  # Provider ID: The name of your workload identity provider (e.g., okta-provider, azure-provider)
  gcp.workload.identity.provider.id: "YOUR_PROVIDER_ID"
  
  # Service Account: The GCP service account to impersonate
  gcp.service.account.email: "your-service-account@your-project.iam.gserviceaccount.com"

  # External Subject Token Configuration - Choose ONE method:
  
  # METHOD 1: Inline Token (for testing or dynamic token generation)
  # This is the JWT/OIDC token from your external OAuth provider
  #external.subject.token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIs..."
  
  # METHOD 2: Token File (recommended for production)
  # Path to a file containing the JWT/OIDC token from your external provider
  external.subject.token.file: "/tmp/external-token.txt"
  
  # Token Type (optional, defaults to JWT)
  # Common values:
  # - urn:ietf:params:oauth:token-type:jwt (default, for OIDC/JWT tokens)
  # - urn:ietf:params:oauth:token-type:id_token (for OIDC ID tokens)
  # - urn:ietf:params:oauth:token-type:access_token (for OAuth2 access tokens)
  external.subject.token.type: "urn:ietf:params:oauth:token-type:jwt"

timeoutMs: 30000
maxMessageRetries: 3
deadLetterTopic: "persistent://public/default/dlq-topic"

